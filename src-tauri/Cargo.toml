[package]
name = "deadlock-fps-fix"
version = "1.0.0"
description = "Deadlock FPS boost and settings tool"
authors = ["Dragonclavelocity"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
