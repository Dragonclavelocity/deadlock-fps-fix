<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deadlock FPS Fix — social preview / OG image (1280×640)</title>
<link rel="stylesheet" href="../dlf.css">
<style>
html,body{width:1280px;height:640px}
.stage{height:640px}
.app{padding:0 56px 44px}
.bar{height:96px;margin-right:0}
.bar .brand{font-size:19px}
.bar .mark{width:26px;height:26px}
.bar .pill{font-size:14px;margin:0}
.hero h1{font-size:96px;margin-top:6px}
.hero .eyebrow{font-size:16px}
.cards{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.ps{background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:18px 20px}
.ps.on{border:1.5px solid var(--acc);background:var(--glass-on)}
.ps b{font-weight:600;font-size:15px}
.ps .h{display:flex;justify-content:space-between;align-items:center}
.ps .v{font-family:var(--serif);font-size:50px;line-height:1;margin-top:10px}
.ps .v small{font-family:var(--sans);font-size:13px;color:var(--text-2);margin-left:6px}
.ps .s{color:var(--text-2);font-size:13px;margin-top:4px}
</style>
</head>
<body>
<div class="stage">
<img class="bgimg" src="../img/deadlock-bg.jpg" alt="">
<div class="shade"></div>
<div class="app">
  <div class="bar">
    <div class="mark"><i></i></div>
    <div class="brand">Deadlock FPS Fix</div>
    <div class="spacer"></div>
    <div class="pill">Free · open source · Windows</div>
  </div>
  <div class="hero">
    <div class="eyebrow">FPS boost · custom FOV · stretched resolution</div>
    <h1>Smooth frames,<br><em>a wider view.</em></h1>
  </div>
  <div class="cards">
    <div class="ps"><b>Competitive</b><div class="v">168<small>fps</small></div><div class="s">+74 est.</div></div>
    <div class="ps on"><div class="h"><b>Balanced</b><span class="tag">Best for your PC</span></div><div class="v">141<small>fps</small></div><div class="s">+47 est.</div></div>
    <div class="ps"><b>Quality</b><div class="v">112<small>fps</small></div><div class="s">+18 est.</div></div>
    <div class="ps"><b>Field of view</b><div class="v">110°</div><div class="s">was 90°</div></div>
    <div class="ps"><b>Resolution</b><div class="v">4:3</div><div class="s">1440×1080 stretched</div></div>
  </div>
</div>
</div>
</body>
</html>
